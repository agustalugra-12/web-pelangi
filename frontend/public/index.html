<!DOCTYPE html>

    <!-- Google tag (gtag.js) - GA4 khusus Pelangi (2026-07-28, permintaan user). Pelangi
         & Harmoni berbagi index.html yang sama (dibedakan lewat domain, bukan build
         terpisah) - dibungkus cek hostname supaya traffic Harmoni TIDAK ikut masuk ke
         GA4 property ini (keputusan eksplisit user, bukan digabung).

         Ditunda sampai window "load" (2026-07-28, ditemukan lewat Lighthouse nyata -
         skor Performance turun ke ~59-66, Total Blocking Time 2.76 detik) - sebelumnya
         script gtag.js (167KB, ~861ms scripting) dimuat SEGERA di paling atas <head>,
         ikut bersaing rebutan bandwidth/main-thread dgn resource kritis (bundle React,
         font, gambar hero) tepat di jendela waktu paling penting utk interaktivitas
         pertama. dataLayer/gtag() tetap disiapkan segera (event apa pun yg terjadi
         sebelum load tetap ke-queue, tidak hilang) - cuma FILE gtag.js aktualnya yang
         ditunda, jadi tidak lagi menunda TTI/blocking main thread. -->
    <script>
      if (window.location.hostname.replace(/^www\./, "") === "pelangihomestay.com") {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag("js", new Date());
        gtag("config", "G-G7FZZ8D480");
        window.addEventListener("load", function () {
          var gtagScript = document.createElement("script");
          gtagScript.async = true;
          gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-G7FZZ8D480";
          document.head.appendChild(gtagScript);
        });
      }
    </script>
